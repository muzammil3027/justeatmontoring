name: Just Eat rider monitor

on:
  schedule:
    # backup only — GitHub's native cron is best-effort and can lag hours on
    # low-traffic public repos. The real cadence comes from an external pinger
    # (cron-job.org) hitting the repository_dispatch endpoint below.
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [ping]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Save screenshots as artifacts'
        type: boolean
        default: false
      cities:
        description: 'Cities to check (comma-separated). Leave empty for the default (Pisa,Livorno) — use this to test a city on demand.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: justeat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Remove unused Google Chrome apt source
        # The runner image pre-configures this repo for unrelated tooling. We
        # only need Chromium (via Playwright), never Google Chrome itself, but
        # `apt-get update` still touches every configured source — including
        # this one — and its Packages.gz has repeatedly lagged its own Release
        # file at the CDN edge ("Hash Sum mismatch"), failing the whole step.
        # Dropping the source removes the failure mode entirely rather than
        # hoping a retry lands on a different, non-stale edge node.
        run: sudo rm -f /etc/apt/sources.list.d/*google*.list

      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITIES: ${{ inputs.cities || 'Pisa,Livorno' }}
        run: node check.mjs ${{ inputs.debug && '--debug' || '' }}

      - name: Upload debug screenshots
        if: always() && inputs.debug
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist state
        if: always()
        run: |
          git config user.name  "justeat-monitor"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push || true
