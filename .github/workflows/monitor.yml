name: Just Eat rider monitor

on:
  schedule:
    # backup only — GitHub's native cron is best-effort and can lag hours on
    # low-traffic public repos. The real cadence comes from an external pinger
    # (cron-job.org) hitting the repository_dispatch endpoint below.
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [ping]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Save screenshots as artifacts'
        type: boolean
        default: false
      cities:
        description: 'Cities to check (comma-separated). Leave empty for the default (Pisa,Livorno) — use this to test a city on demand.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: justeat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        # The runner image ships with Google Chrome's apt source pre-configured.
        # Its Packages.gz occasionally lags its own Release file at the CDN edge
        # ("Hash Sum mismatch"), which fails `apt-get update` even though we
        # never touch that repo. Retry — it's a transient upstream cache lag,
        # not anything under our control.
        run: |
          for attempt in 1 2 3 4 5; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Run check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITIES: ${{ inputs.cities || 'Pisa,Livorno' }}
        run: node check.mjs ${{ inputs.debug && '--debug' || '' }}

      - name: Upload debug screenshots
        if: always() && inputs.debug
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist state
        if: always()
        run: |
          git config user.name  "justeat-monitor"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push || true
